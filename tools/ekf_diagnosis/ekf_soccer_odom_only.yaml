### ekf_soccer_odom_only.yaml  [Fase 1B — Odom-Only Test]
### Tujuan: ukur seberapa baik EKF tracking dengan odom murni, tanpa AMCL.
### Ekspektasi: untuk straight-walk 180s dengan odom k=1.04 & yaw≈0,
###             error absolut < 0.1m — harusnya sangat baik.
###
### CARA PAKAI: ganti ekf_soccer.yaml di launch file sementara untuk test.
### JANGAN commit sebagai default — ini alat diagnosa, bukan konfigurasi produksi.
ekf_filter_node:
  ros__parameters:
    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_link
    world_frame:     map
    frequency:       10.0
    publish_tf:      true
    print_diagnostics: false
    smooth_lagged_data: true
    history_length:     0.3

    # Hanya odom0 aktif — AMCL (pose0) dan Cox (pose1) dinonaktifkan.
    # pose0 dan pose1 tidak boleh ditulis sama sekali kalau tidak ada sumbernya;
    # cukup hapus baris pose0/pose1 dari launch yang meload yaml ini.
    odom0: /odom_throttled
    odom0_config: [true, true, false,
                   false, false, true,
                   true, false, false,
                   false, false, false,
                   false, false, false]
    # Dibanding default: tambah yaw (index 5) agar tracking yaw dari odom
    odom0_differential:  false
    odom0_relative:      false
    odom0_queue_size:    5
    odom0_pose_rejection_threshold:  999.0
    odom0_twist_rejection_threshold: 999.0

    process_noise_covariance: [
